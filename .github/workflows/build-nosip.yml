name: Build PEGPU Machine macOS 13.5 app artifact

on:
  push:
    branches:
      - codex/macos-13-5-actions-artifact
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version to write into the app and manifests, for example 0.1.101"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MACOSX_DEPLOYMENT_TARGET: "13.5"
  DRIVERKIT_DEPLOYMENT_TARGET: "22.5"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  build:
    name: Build PEGPU Machine app
    runs-on: macos-26
    defaults:
      run:
        shell: bash
        working-directory: qemu-source

    steps:
      - name: Checkout patch control branch
        uses: actions/checkout@v6
        with:
          path: patch-control

      - name: Checkout clean QEMU base
        uses: actions/checkout@v6
        with:
          repository: openresearchtools/PEGPU-machine
          ref: base
          path: qemu-source
          persist-credentials: false

      - name: Apply source patch stack
        run: |
          PATCH_STACK_DIR="../patch-control/patch-stack"
          copy_patch_assets() {
            local asset_dir="$PATCH_STACK_DIR/03-openresearchtools-vfiouserhostapp-core/assets"
            if [[ -d "$asset_dir" ]]; then
              cp -R "$asset_dir"/. .
            fi
          }
          git remote set-url --push origin DISABLED
          if [[ -x contrib/apple-vfio/scripts/build-nosip.sh ]] && grep -q 'CONFIG_ANGLE' include/ui/egl-helpers.h; then
            copy_patch_assets
            echo "source patch stack already applied"
            exit 0
          fi
          test -f "$PATCH_STACK_DIR/01-scottjg-qemu-vfio-apple-wip/0001-scottjg-qemu-vfio-apple-wip.patch"
          test -f "$PATCH_STACK_DIR/02-utmapp-qemu-based-visual-runtime/0001-utmapp-qemu-based-visual-runtime.patch"
          test -f "$PATCH_STACK_DIR/03-openresearchtools-vfiouserhostapp-core/0001-openresearchtools-vfiouserhostapp-core.patch"
          git apply \
            --exclude='.github/workflows/build-nosip.yml' \
            "$PATCH_STACK_DIR/01-scottjg-qemu-vfio-apple-wip/0001-scottjg-qemu-vfio-apple-wip.patch"
          git apply \
            --exclude='.github/workflows/build-nosip.yml' \
            "$PATCH_STACK_DIR/02-utmapp-qemu-based-visual-runtime/0001-utmapp-qemu-based-visual-runtime.patch"
          git apply \
            --exclude='.github/workflows/build-nosip.yml' \
            "$PATCH_STACK_DIR/03-openresearchtools-vfiouserhostapp-core/0001-openresearchtools-vfiouserhostapp-core.patch"
          copy_patch_assets
          rm -rf patch-stack
          cp -R "$PATCH_STACK_DIR" patch-stack
          find patch-stack -name '.DS_Store' -delete

      - name: Verify deployment targets
        run: |
          PROJECT_FILE="contrib/apple-vfio/VFIOUserHostApp.xcodeproj/project.pbxproj"
          grep -F 'MACOSX_DEPLOYMENT_TARGET = 13.5;' "$PROJECT_FILE"
          grep -F 'DRIVERKIT_DEPLOYMENT_TARGET = 22.5;' "$PROJECT_FILE"
          if grep -E 'MACOSX_DEPLOYMENT_TARGET = (2[4-9]|1[4-9])\.' "$PROJECT_FILE"; then
            echo "found a macOS deployment target higher than 13.5" >&2
            exit 1
          fi
          if grep -E 'DRIVERKIT_DEPLOYMENT_TARGET = (2[3-9]|[3-9][0-9])\.' "$PROJECT_FILE"; then
            echo "found a DriverKit deployment target higher than 22.5" >&2
            exit 1
          fi

      - name: Show runner and Xcode
        run: |
          sw_vers
          uname -a
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcode-select -p
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk driverkit --show-sdk-version

      - name: Install macOS build dependencies
        run: |
          brew update
          brew install \
            ccache \
            coreutils \
            dpkg \
            gnu-sed \
            gnu-tar \
            jq \
            meson \
            ninja \
            pkg-config

          export PATH="/opt/homebrew/opt/gnu-sed/libexec/gnubin:/opt/homebrew/opt/gnu-tar/libexec/gnubin:/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH"

          source_formulae=(
            libunistring
            gettext
            pcre2
            glib
            gmp
            nettle
            libtasn1
            libidn2
            p11-kit
            gnutls
            bzip2
            xz
            lz4
            zstd
            jpeg-turbo
            libpng
            lzo
            opus
            orc
            pixman
            snappy
            libusb
            libslirp
          )

          for formula in "${source_formulae[@]}"; do
            if brew list --formula "$formula" >/dev/null 2>&1; then
              brew uninstall --ignore-dependencies "$formula"
            fi
            brew install --build-from-source "$formula"
          done

          {
            echo "/opt/homebrew/opt/gnu-sed/libexec/gnubin"
            echo "/opt/homebrew/opt/gnu-tar/libexec/gnubin"
            echo "/opt/homebrew/opt/coreutils/libexec/gnubin"
            echo "/opt/homebrew/opt/ccache/libexec"
          } >> "$GITHUB_PATH"

      - name: Validate Homebrew runtime deployment targets
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          formulae = """
          libunistring gettext pcre2 glib gmp nettle libtasn1 libidn2 p11-kit gnutls
          bzip2 xz lz4 zstd jpeg-turbo libpng lzo opus orc pixman snappy libusb libslirp
          """.split()
          limit = (13, 5)

          def version_tuple(text):
              return tuple(int(part) for part in text.split(".") if part.isdigit())

          def minos(path):
              try:
                  output = subprocess.check_output(["otool", "-l", str(path)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  return []
              versions = []
              legacy_macos = False
              for raw in output.splitlines():
                  line = raw.strip()
                  if line == "cmd LC_VERSION_MIN_MACOSX":
                      legacy_macos = True
                      continue
                  if legacy_macos and line.startswith("version "):
                      versions.append(("macos", line.split()[1]))
                      legacy_macos = False
                      continue
                  if line.startswith("platform "):
                      platform = line.split(None, 1)[1].lower()
                      continue
                  if line.startswith("minos "):
                      versions.append((locals().get("platform", "macos"), line.split()[1]))
              return versions

          bad = []
          checked = 0
          for formula in formulae:
              prefix = subprocess.check_output(["brew", "--prefix", formula], text=True).strip()
              for dylib in pathlib.Path(prefix).rglob("*.dylib"):
                  for platform, version in minos(dylib):
                      if "macos" in platform.lower() and version_tuple(version) > limit:
                          bad.append(f"{dylib}: macOS minos {version}")
                  checked += 1
          if bad:
              print("Homebrew runtime libraries are not macOS 13.5-compatible:", file=sys.stderr)
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          print(f"checked {checked} Homebrew dylib(s)")
          PY

      - name: Build guest driver DKMS bundle
        run: contrib/apple-dma/scripts/build-guest-driver-bundle.sh
        env:
          PEGPU_DRIVER_VERSION: ${{ github.event.inputs.release_version || '' }}

      - name: Validate guest tools
        run: |
          echo "Guest tools artifact tree:"
          find artifacts/guest-tools -maxdepth 4 -type f -print | sort
          require_artifact_file() {
            if [ ! -f "$1" ]; then
              echo "missing expected guest-tools artifact: $1" >&2
              find artifacts/guest-tools -maxdepth 4 -type f -print | sort >&2 || true
              exit 1
            fi
          }
          require_artifact_file artifacts/guest-tools/manifest.json
          require_artifact_file artifacts/guest-tools/pegpu-guest-driver-bundle.tar.gz
          require_artifact_file artifacts/guest-tools/SHA512SUMS
          jq -e '.driver.dkmsPackages | length == 1' artifacts/guest-tools/manifest.json
          jq -e 'has("kernels") | not' artifacts/guest-tools/manifest.json
          jq -e '.driver | has("prebuiltPackages") | not' artifacts/guest-tools/manifest.json
          DKMS_DEB="$(find artifacts/guest-tools/packages -type f -name 'apple-dma-dkms_*.deb' -print -quit)"
          test -n "$DKMS_DEB"
          DKMS_ROOT="$RUNNER_TEMP/apple-dma-dkms-root"
          rm -rf "$DKMS_ROOT"
          mkdir -p "$DKMS_ROOT"
          dpkg-deb -x "$DKMS_DEB" "$DKMS_ROOT"
          test -f "$DKMS_ROOT/usr/sbin/apple-dma-config"
          test -f "$DKMS_ROOT/usr/share/apple-dma/apple-dma-options.conf"
          ! find artifacts/guest-tools/packages -type f -name 'apple-dma-modules-*.deb' -print -quit | grep -q .
          test -n "$(find artifacts/guest-tools/source -type f -name 'apple-dma-*.tar.gz' -print -quit)"
          (cd artifacts/guest-tools && sha512sum -c SHA512SUMS)

      - name: Restore display dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pegpu/qemu-display-deps
          key: macos26-arm64-macos13.5-display-deps-opengl-virgl-v1-${{ hashFiles('patch-control/patch-stack/**') }}

      - name: Build display dependencies
        id: display-deps
        run: |
          DISPLAY_DEPS="$HOME/.cache/pegpu/qemu-display-deps"
          DISPLAY_SRC="$RUNNER_TEMP/qemu-display-src"
          DEPS_PC="$DISPLAY_DEPS/lib/pkgconfig:$DISPLAY_DEPS/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          check_minos_tree() {
            python3 - "$1" <<'PY'
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])
          limit = (13, 5)

          def version_tuple(text):
              return tuple(int(part) for part in text.split(".") if part.isdigit())

          def minos(path):
              output = subprocess.check_output(["otool", "-l", str(path)], text=True, stderr=subprocess.DEVNULL)
              versions = []
              platform = "macos"
              legacy_macos = False
              for raw in output.splitlines():
                  line = raw.strip()
                  if line == "cmd LC_VERSION_MIN_MACOSX":
                      legacy_macos = True
                      continue
                  if legacy_macos and line.startswith("version "):
                      versions.append(("macos", line.split()[1]))
                      legacy_macos = False
                      continue
                  if line.startswith("platform "):
                      platform = line.split(None, 1)[1].lower()
                      continue
                  if line.startswith("minos "):
                      versions.append((platform, line.split()[1]))
              return versions

          bad = []
          for dylib in root.rglob("*.dylib"):
              for platform, version in minos(dylib):
                  if "macos" in platform.lower() and version_tuple(version) > limit:
                      bad.append(f"{dylib}: macOS minos {version}")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
          }

          if PKG_CONFIG_PATH="$DEPS_PC" pkg-config --modversion epoxy | grep -Fx '1.5.10' && \
             PKG_CONFIG_PATH="$DEPS_PC" pkg-config --variable=epoxy_has_egl epoxy | grep -Fx '1' && \
             PKG_CONFIG_PATH="$DEPS_PC" pkg-config --modversion openssl | grep -Fx '4.3.2' && \
             PKG_CONFIG_PATH="$DEPS_PC" pkg-config --modversion spice-protocol | grep -Fx '0.14.5' && \
             PKG_CONFIG_PATH="$DEPS_PC" pkg-config --modversion spice-server | grep -Fx '0.16.0' && \
             test -f "$DISPLAY_DEPS/include/epoxy/egl.h" && \
             test -f "$DISPLAY_DEPS/include/EGL/eglplatform.h" && \
             test -f "$DISPLAY_DEPS/lib/libepoxy.0.dylib" && \
             test -f "$DISPLAY_DEPS/lib/libspice-server.1.dylib" && \
             test -f "$DISPLAY_DEPS/lib/libssl.60.dylib" && \
             test -f "$DISPLAY_DEPS/lib/libcrypto.57.dylib" && \
             test ! -e "$DISPLAY_DEPS/lib/libssl.3.dylib" && \
             test ! -e "$DISPLAY_DEPS/lib/libcrypto.3.dylib" && \
             test -f "$DISPLAY_DEPS"/lib/libvirglrenderer*.dylib && \
             test ! -d "$DISPLAY_DEPS/libexec" && \
             check_minos_tree "$DISPLAY_DEPS"
          then
            echo "using cached display dependencies at $DISPLAY_DEPS"
          else
            rm -rf "$DISPLAY_DEPS"
            contrib/apple-vfio/scripts/build-display-deps.sh "$DISPLAY_DEPS" "$DISPLAY_SRC"
            check_minos_tree "$DISPLAY_DEPS"
          fi
          echo "prefix=$DISPLAY_DEPS" >> "$GITHUB_OUTPUT"
        env:
          CFLAGS: -mmacosx-version-min=13.5
          CXXFLAGS: -mmacosx-version-min=13.5
          OBJCFLAGS: -mmacosx-version-min=13.5
          LDFLAGS: -mmacosx-version-min=13.5

      - name: Fetch QEMU Meson subprojects
        run: |
          meson subprojects download \
            berkeley-softfloat-3 \
            berkeley-testfloat-3 \
            dtc \
            keycodemapdb
          for subproject in \
            berkeley-softfloat-3 \
            berkeley-testfloat-3 \
            dtc \
            keycodemapdb
          do
            test -d "subprojects/$subproject"
          done

      - name: Prepare QEMU Python wheelhouse
        run: |
          python3 -m pip download \
            --only-binary=:all: \
            --dest python/wheels \
            'setuptools>=44.1.1' \
            'wheel>=0.34.2' \
            'pip>=20.3.4'
          test -f python/wheels/qemu_qmp-0.0.5-py3-none-any.whl

      - name: Restore QEMU compiler cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ccache
          key: macos26-arm64-macos13.5-qemu-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            macos26-arm64-macos13.5-qemu-ccache-${{ github.ref_name }}-
            macos26-arm64-macos13.5-qemu-ccache-

      - name: Configure QEMU
        run: |
          mkdir -p build-qemu-nosip
          cd build-qemu-nosip
          export PKG_CONFIG_PATH="${{ steps.display-deps.outputs.prefix }}/lib/pkgconfig:${{ steps.display-deps.outputs.prefix }}/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          ../configure \
            --target-list=aarch64-softmmu \
            --enable-bzip2 \
            --enable-cocoa \
            --enable-fdt=internal \
            --enable-gnutls \
            --enable-hvf \
            --enable-opengl \
            --enable-libusb \
            --enable-pixman \
            --enable-spice \
            --enable-spice-protocol \
            --enable-slirp \
            --enable-virglrenderer \
            --enable-vhost-user \
            --enable-zstd \
            --disable-dbus-display \
            --disable-gtk \
            --disable-sdl \
            --disable-docs \
            --disable-download \
            --disable-werror
        env:
          CC: ccache clang
          CXX: ccache clang++
          CFLAGS: -mmacosx-version-min=13.5
          CXXFLAGS: -mmacosx-version-min=13.5
          OBJCFLAGS: -mmacosx-version-min=13.5
          LDFLAGS: -mmacosx-version-min=13.5

      - name: Build QEMU binaries
        run: ninja -C build-qemu-nosip qemu-system-aarch64 qemu-img

      - name: Show compiler cache stats
        if: always()
        run: ccache --show-stats || true

      - name: Verify required frontend devices
        run: |
          build-qemu-nosip/qemu-system-aarch64 -machine virt -device help | tee "$RUNNER_TEMP/qemu-devices.txt"
          grep -E 'vhost-user-fs-(pci|device)' "$RUNNER_TEMP/qemu-devices.txt"
          grep -E 'vfio-apple-pci' "$RUNNER_TEMP/qemu-devices.txt"
          grep -E 'vfio-apple-auto-pci' "$RUNNER_TEMP/qemu-devices.txt"
          grep -E 'virtio-gpu-gl-pci' "$RUNNER_TEMP/qemu-devices.txt"
          build-qemu-nosip/qemu-system-aarch64 -machine virt -spice help > "$RUNNER_TEMP/qemu-spice.txt" || test "$?" = "1"
          cat "$RUNNER_TEMP/qemu-spice.txt"
          grep -E '^[[:space:]]*gl=' "$RUNNER_TEMP/qemu-spice.txt"

      - name: Build QEMU dist
        id: qemu-runtime
        run: |
          contrib/apple-vfio/scripts/make-dist.sh build-qemu-nosip dist
          test -x dist/qemu-system-aarch64
          test -x dist/qemu-img
          test -f dist/lib/libspice-server.1.dylib
          test -f dist/lib/libssl.60.dylib
          test -f dist/lib/libcrypto.57.dylib
          test ! -e dist/lib/libssl.3.dylib
          test ! -e dist/lib/libcrypto.3.dylib
          test -f dist/share/qemu/edk2-aarch64-code.fd
          test -f dist/share/qemu/edk2-arm-vars.fd
          test -f dist/share/qemu/efi-virtio.rom
          test ! -d dist/libexec
          echo "dist=$PWD/dist" >> "$GITHUB_OUTPUT"
        env:
          CODESIGN_IDENTITY: "-"

      - name: Resolve app version
        id: version
        run: |
          VERSION="${{ github.event.inputs.release_version || '' }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(awk -F ' = |;' '/MARKETING_VERSION =/ { print $2; exit }' contrib/apple-vfio/VFIOUserHostApp.xcodeproj/project.pbxproj)"
          fi
          BUILD_NUMBER="$VERSION"
          case "$VERSION" in
            *[!0-9A-Za-z._-]*|"")
              echo "invalid app version: $VERSION" >&2
              exit 1
              ;;
          esac
          {
            echo "marketing_version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          printf 'App version: %s\n' "$VERSION"

      - name: Build no-SIP app
        id: nosip
        run: contrib/apple-vfio/scripts/build-nosip.sh --build
        env:
          CONFIGURATION: Release
          ARCHS: arm64
          ONLY_ACTIVE_ARCH: "NO"
          QEMU_DIST_DIR: ${{ steps.qemu-runtime.outputs.dist }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build_number }}
          PEGPU_PUBLISH_RELEASE: "false"

      - name: Validate bundled app
        run: |
          APP="${{ steps.nosip.outputs.app }}"
          DEXT="${{ steps.nosip.outputs.dext }}"
          PROBE="$RUNNER_TEMP/probe.qcow2"
          test -d "$APP"
          test "$(basename "$APP")" = "PEGPU Machine.app"
          test -d "$DEXT"
          test -x "$APP/Contents/MacOS/PEGPU Machine"
          test -x "$APP/Contents/MacOS/qemu-vfio-apple"
          test -x "$APP/Contents/MacOS/qemu-system-aarch64"
          test -x "$APP/Contents/MacOS/qemu-img"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$APP/Contents/Info.plist")" = "PEGPU Machine"
          test "$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" = "PEGPU Machine"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "${{ steps.version.outputs.marketing_version }}"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")" = "${{ steps.version.outputs.build_number }}"
          test -f "$APP/Contents/Resources/manifest.json"
          test -f "$APP/Contents/Resources/share/qemu/edk2-aarch64-code.fd"
          test -f "$APP/Contents/Resources/share/qemu/edk2-arm-vars.fd"
          test -f "$APP/Contents/Resources/share/qemu/efi-virtio.rom"
          test -f "$APP/Contents/Resources/pci.ids"
          test -f "$APP/Contents/Resources/guest-tools/manifest.json"
          test ! -d "$APP/Contents/Resources/guest-tools/work"
          test -n "$(find "$APP/Contents/Resources/guest-tools/packages" -type f -name 'apple-dma-dkms_*.deb' -print -quit)"
          ! find "$APP/Contents/Resources/guest-tools/packages" -type f -name 'apple-dma-modules-*.deb' -print -quit | grep -q .
          test -n "$(find "$APP/Contents/Resources/guest-tools/source" -type f -name 'apple-dma-*.tar.gz' -print -quit)"
          test -f "$APP/Contents/Resources/ThirdPartyNotices/NOTICES"
          test -f "$APP/Contents/Resources/ThirdPartyNotices/LICENSES"
          test "$(find "$APP/Contents/Resources/ThirdPartyNotices" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          test ! -e "$APP/Contents/Resources/ThirdPartyNotices/license-files"
          test -f "$APP/Contents/MacOS/lib/libspice-server.1.dylib"
          test -f "$APP/Contents/MacOS/lib/libssl.60.dylib"
          test -f "$APP/Contents/MacOS/lib/libcrypto.57.dylib"
          test ! -e "$APP/Contents/MacOS/lib/libssl.3.dylib"
          test ! -e "$APP/Contents/MacOS/lib/libcrypto.3.dylib"
          if find "$APP" \
              \( -name 'EGL.framework' -o -name 'GLESv2.framework' -o -path '*/Source/ThirdParty/ANGLE*' -o -iname '*WebKit*' \) \
              -print -quit | grep -q .; then
            echo "PEGPU Machine must not vendor app-side WebKit/ANGLE payloads" >&2
            exit 1
          fi
          grep -F 'Acknowledgements and Independence' "$APP/Contents/Resources/ThirdPartyNotices/NOTICES"
          grep -F 'Contents/Library/SystemExtensions/com.pegpu.machine.VFIOUserPCIDriver.dext' "$APP/Contents/Resources/ThirdPartyNotices/NOTICES"
          grep -F 'Package/Dependency: PEGPU Machine GPL-side host, qemu-vfio-apple, and DriverKit integration' "$APP/Contents/Resources/ThirdPartyNotices/LICENSES"
          python3 - "$APP/Contents/Resources/manifest.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as f:
              manifest = json.load(f)
          assert manifest["product"] == "PEGPU Machine"
          assert manifest["version"]
          assert manifest["build"]
          assert manifest["distribution"]["format"] == "zip"
          assert manifest["distribution"]["arch"] == "arm64"
          dkms = manifest["guestTools"]["dkmsPackages"]
          assert len(dkms) == 1
          assert "prebuiltPackages" not in manifest["guestTools"]
          assert "kernels" not in manifest["guestTools"]
          PY
          "$APP/Contents/MacOS/qemu-img" create -f qcow2 "$PROBE" 64M
          touch "$RUNNER_TEMP/probe-seed.iso"
          ANGLE_PROBE="$RUNNER_TEMP/app-frameworks"
          mkdir -p "$ANGLE_PROBE/EGL.framework/Versions/Current" "$ANGLE_PROBE/GLESv2.framework/Versions/Current"
          touch "$ANGLE_PROBE/EGL.framework/Versions/Current/EGL" "$ANGLE_PROBE/GLESv2.framework/Versions/Current/GLESv2"
          "$APP/Contents/MacOS/qemu-vfio-apple" start \
            --disk "$PROBE" \
            --memory 512M \
            --cpus 1 \
            --headless \
            --efi-vars "$RUNNER_TEMP/probe-headless-efi-vars.fd" \
            --seed-iso "$RUNNER_TEMP/probe-seed.iso" \
            --pidfile "$RUNNER_TEMP/probe-headless.pid" \
            --serial-log "$RUNNER_TEMP/probe-headless.serial.log" \
            --qemu-log "$RUNNER_TEMP/probe-headless.qemu.log" \
            --dry-run \
            --qmp "$RUNNER_TEMP/probe-qmp.sock" \
            --vmnet-netdev vmnet-shared \
            --vmnet-start-address 172.29.253.1 \
            --vmnet-end-address 172.29.253.99 \
            --vmnet-subnet-mask 255.255.255.0 \
            | tee "$RUNNER_TEMP/qemu-vfio-apple-headless-dry-run.txt"
          "$APP/Contents/MacOS/qemu-vfio-apple" start \
            --disk "$PROBE" \
            --memory 512M \
            --cpus 1 \
            --efi-vars "$RUNNER_TEMP/probe-gui-efi-vars.fd" \
            --seed-iso "$RUNNER_TEMP/probe-seed.iso" \
            --pidfile "$RUNNER_TEMP/probe-gui.pid" \
            --serial-log "$RUNNER_TEMP/probe-gui.serial.log" \
            --qemu-log "$RUNNER_TEMP/probe-gui.qemu.log" \
            --spice-socket "$RUNNER_TEMP/probe.spice" \
            --angle-framework-dir "$ANGLE_PROBE" \
            --dry-run \
            --qmp "$RUNNER_TEMP/probe-gui-qmp.sock" \
            --vmnet-netdev vmnet-shared \
            --vmnet-start-address 172.29.253.1 \
            --vmnet-end-address 172.29.253.99 \
            --vmnet-subnet-mask 255.255.255.0 \
            2> "$RUNNER_TEMP/qemu-vfio-apple-gui-dry-run.err" \
            | tee "$RUNNER_TEMP/qemu-vfio-apple-gui-dry-run.txt"
          for dry_run in "$RUNNER_TEMP/qemu-vfio-apple-headless-dry-run.txt" "$RUNNER_TEMP/qemu-vfio-apple-gui-dry-run.txt"; do
            grep -F 'qemu-system-aarch64' "$dry_run"
            grep -F "$PROBE" "$dry_run"
            grep -F 'hvf,tso=on' "$dry_run"
            grep -F 'memory-backend-ram,id=pc.ram,size=512M,prealloc=on,share=off' "$dry_run"
            grep -F 'virt,highmem=on,memory-backend=pc.ram' "$dry_run"
            grep -F 'id=seed0' "$dry_run"
            grep -F 'vmnet-shared,id=net0' "$dry_run"
            grep -F 'virtio-net-pci,netdev=net0' "$dry_run"
            ! grep -F 'romfile=,rombar=0' "$dry_run"
            grep -F 'vfio-apple-auto-pci' "$dry_run"
          done
          grep -F -- '-display' "$RUNNER_TEMP/qemu-vfio-apple-headless-dry-run.txt"
          grep -F 'none' "$RUNNER_TEMP/qemu-vfio-apple-headless-dry-run.txt"
          grep -F -- '-nographic' "$RUNNER_TEMP/qemu-vfio-apple-headless-dry-run.txt"
          grep -F -- '-spice' "$RUNNER_TEMP/qemu-vfio-apple-gui-dry-run.txt"
          grep -F "unix=on,addr=$RUNNER_TEMP/probe.spice" "$RUNNER_TEMP/qemu-vfio-apple-gui-dry-run.txt"
          grep -F 'gl=on' "$RUNNER_TEMP/qemu-vfio-apple-gui-dry-run.txt"
          grep -F "angle frameworks: $ANGLE_PROBE" "$RUNNER_TEMP/qemu-vfio-apple-gui-dry-run.err"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --deep --strict --verbose=2 "$DEXT"

      - name: Validate macOS 13.5 Mach-O floors
        run: |
          APP="${{ steps.nosip.outputs.app }}"
          python3 - "$APP" <<'PY'
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])
          limits = {
              "macos": (13, 5),
              "driverkit": (22, 5),
          }

          def version_tuple(text):
              return tuple(int(part) for part in text.split(".") if part.isdigit())

          def macho(path):
              try:
                  desc = subprocess.check_output(["file", "-b", str(path)], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  return False
              return "Mach-O" in desc

          def versions(path):
              output = subprocess.check_output(["otool", "-l", str(path)], text=True, stderr=subprocess.DEVNULL)
              found = []
              platform = "macos"
              legacy_macos = False
              for raw in output.splitlines():
                  line = raw.strip()
                  if line == "cmd LC_VERSION_MIN_MACOSX":
                      legacy_macos = True
                      continue
                  if legacy_macos and line.startswith("version "):
                      found.append(("macos", line.split()[1]))
                      legacy_macos = False
                      continue
                  if line.startswith("platform "):
                      platform = line.split(None, 1)[1].lower()
                      continue
                  if line.startswith("minos "):
                      found.append((platform, line.split()[1]))
              return found

          bad = []
          checked = 0
          for path in root.rglob("*"):
              if not path.is_file() or not macho(path):
                  continue
              checked += 1
              for platform, minos in versions(path):
                  key = "driverkit" if "driverkit" in platform.lower() else "macos"
                  if version_tuple(minos) > limits[key]:
                      bad.append(f"{path.relative_to(root)}: {platform} minos {minos}")
          if bad:
              print("Mach-O files exceed the requested deployment floor:", file=sys.stderr)
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          print(f"checked {checked} Mach-O file(s)")
          PY

      - name: Compute app artifact name
        id: artifact
        run: |
          APP="${{ steps.nosip.outputs.app }}"
          VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          safe_name() {
            printf '%s' "$1" | tr -c 'A-Za-z0-9._-' '-'
          }
          VERSION_SAFE="$(safe_name "$VERSION")"
          BASE="PEGPU-Machine-${VERSION_SAFE}-macOS13.5-arm64"
          {
            echo "base=$BASE"
            echo "zip=$RUNNER_TEMP/${BASE}.zip"
            echo "artifact_name=${BASE}-app"
          } >> "$GITHUB_OUTPUT"
          printf 'artifact: %s\n' "$BASE"

      - name: Package app artifact
        run: |
          APP="${{ steps.nosip.outputs.app }}"
          PACKAGE="$RUNNER_TEMP/${{ steps.artifact.outputs.base }}"
          ZIP_PATH="${{ steps.artifact.outputs.zip }}"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE"
          ditto "$APP" "$PACKAGE/PEGPU Machine.app"
          ditto -c -k "$PACKAGE" "$ZIP_PATH"
          zipinfo -1 "$ZIP_PATH" | grep -Fx 'PEGPU Machine.app/Contents/MacOS/PEGPU Machine'
          zipinfo -1 "$ZIP_PATH" | grep -Fx 'PEGPU Machine.app/Contents/MacOS/qemu-vfio-apple'
          zipinfo -1 "$ZIP_PATH" | grep -Fx 'PEGPU Machine.app/Contents/MacOS/qemu-system-aarch64'
          zipinfo -1 "$ZIP_PATH" | grep -Fx 'PEGPU Machine.app/Contents/Library/SystemExtensions/com.pegpu.machine.VFIOUserPCIDriver.dext/Contents/Info.plist'
          zipinfo -1 "$ZIP_PATH" | grep -Fx 'PEGPU Machine.app/Contents/Resources/guest-tools/manifest.json'
          zipinfo -1 "$ZIP_PATH" | grep -Fx 'PEGPU Machine.app/Contents/Resources/manifest.json'
          if zipinfo -1 "$ZIP_PATH" | grep -E '^THIRD_PARTY_NOTICES/'; then
            echo "app artifact zip must not ship a root-level THIRD_PARTY_NOTICES sidecar" >&2
            exit 1
          fi

      - name: Upload PEGPU Machine app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.zip }}
          if-no-files-found: error
